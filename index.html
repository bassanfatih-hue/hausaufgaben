<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hausaufgaben">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1E3A5F">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Hausaufgaben-Planer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: Handy = eine Spalte (Woche, Liste, Schultag). Ab Tablet-Breite links Schultag + Tests, rechts die Liste nach Fälligkeit. */
  --bg:#F2F4F8; --surface:#FFFFFF; --sunk:#E9EDF3; --ink:#131B27; --muted:#626D80; --line:#E0E4EB;
  --accent:#1E3A5F; --on-accent:#FFFFFF; --accent-soft:#E2E9F2;
  --danger:#B42318; --danger-soft:#FBE8E6; --warn:#A06400; --ok:#2E7D4F;
  --font:"Poppins", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px; --r-sm:12px;
  --shadow:0 1px 2px rgba(19,27,39,.05), 0 4px 14px rgba(19,27,39,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1219; --surface:#161E29; --sunk:#1E2836; --ink:#E7ECF3; --muted:#97A3B6; --line:#263243;
    --accent:#A3BFE5; --on-accent:#0D1219; --accent-soft:#1F2C3F;
    --danger:#FF8F84; --danger-soft:#3A1F1F; --warn:#E6B561; --ok:#7CCB9C;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1219; --surface:#161E29; --sunk:#1E2836; --ink:#E7ECF3; --muted:#97A3B6; --line:#263243;
  --accent:#A3BFE5; --on-accent:#0D1219; --accent-soft:#1F2C3F;
  --danger:#FF8F84; --danger-soft:#3A1F1F; --warn:#E6B561; --ok:#7CCB9C;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:22px 16px 120px}

/* Kopf */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.sub{margin-top:4px;color:var(--muted);font-size:14px}

/* Zahlen */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.stat{background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.stat b{display:block;font-size:24px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.stat.alert{background:var(--danger-soft)}
.stat.alert b,.stat.alert span{color:var(--danger)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}

/* Wochenleiste */
.weeks{display:flex;flex-wrap:wrap;gap:12px 16px;margin-top:18px}
.weekrow{flex:1 1 320px;min-width:0}
.wlabel{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 2px 6px}
.wgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.day{border:0;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:7px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:70px}
.day .wd{font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.day .num{font-size:19px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.dots{display:flex;align-items:center;gap:3px;height:10px;font-size:10px;font-weight:600;color:var(--muted)}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dots i.t{background:var(--danger)}
.day.past{opacity:.5}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day.sel{background:var(--accent);color:var(--on-accent);box-shadow:none;opacity:1}
.day.sel .wd,.day.sel .dots{color:var(--on-accent)}
.day.sel .dots i{background:var(--on-accent)}
.day.free{background:transparent;box-shadow:inset 0 0 0 1px var(--line);cursor:default}
.day.free .num{color:var(--muted);font-weight:500}
.day .freetxt{font-size:10px;color:var(--muted);line-height:10px}

/* Raster */
.layout{display:grid;gap:22px;margin-top:22px}
.side{display:grid;gap:16px;align-content:start}
@media (min-width:900px){
  .layout{grid-template-columns:340px minmax(0,1fr);align-items:start}
  .side{order:-1;position:sticky;top:16px}
}

/* Karten */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.ctitle{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.chead{font-size:19px;font-weight:600;margin:2px 0 8px;line-height:1.25}
.cnote{font-size:13px;color:var(--muted);margin:0 0 8px}
.lesson{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.lesson .hr{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.3}
.lesson .hr b{font-weight:600;color:var(--ink)}
.lesson .hr small{font-size:11.5px}
.lesson.done{opacity:.45}
.lesson.now{background:var(--accent-soft);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:10px;border-top-color:transparent}
.lesson .nm{font-weight:500;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hstrip{display:flex;gap:3px;margin-top:4px}
.hstrip i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.hstrip i.on{background:var(--c)}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag.open{background:var(--accent-soft);color:var(--accent)}
.tag.none{color:var(--muted);font-weight:500}
.tag.test{background:var(--danger-soft);color:var(--danger)}
.extra{margin-top:8px;padding-top:9px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.okline{margin-top:8px;font-size:13.5px;color:var(--ok);font-weight:500}

.test{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.test:first-of-type{border-top:0}
.cd{background:var(--danger-soft);color:var(--danger);border-radius:12px;text-align:center;padding:6px 0}
.cd b{display:block;font-size:20px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.cd span{font-size:11px}
.test .tt{font-weight:500;font-size:14.5px;overflow-wrap:anywhere}
.test .td{font-size:12.5px;color:var(--muted)}

/* Liste */
.filter{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:8px 8px 8px 14px;margin-bottom:14px;font-weight:500;font-size:14px}
.filter button{border:0;background:var(--surface);color:var(--accent);border-radius:9px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}
.group{margin-bottom:20px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 4px 8px}
.ghead h2{margin:0;font-size:17px;font-weight:600}
.ghead span{font-size:13px;color:var(--muted);white-space:nowrap}
.ghead.danger h2,.ghead.danger span{color:var(--danger)}
.items{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.is-test{box-shadow:inset 3px 0 0 var(--danger)}
.check{flex:none;width:54px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;padding:0}
.box{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--c,var(--muted));display:grid;place-items:center;transition:background .15s}
.box svg{width:14px;height:14px;opacity:0}
.item.done .box{background:var(--ok);box-shadow:none}
.item.done .box svg{opacity:1}
.check:hover .box svg{opacity:.35}
.item.done .check:hover .box svg{opacity:1}
.body{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:11px 14px 12px 0;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink);background:var(--sunk);background:color-mix(in srgb,var(--c) 15%,var(--surface));padding:2px 9px 2px 7px;border-radius:999px}
.pill .dot,.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.badge{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--danger-soft);color:var(--danger)}
.badge.todo{background:var(--accent-soft);color:var(--accent)}
.star{color:var(--warn);font-size:13px}
.ititle{font-size:15.5px;font-weight:500;overflow-wrap:anywhere;line-height:1.35}
.inote{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.item.done .ititle{text-decoration:line-through;color:var(--muted)}
.late{color:var(--danger);font-weight:500}
.when{font-weight:500;color:var(--ink);opacity:.75}

.empty{text-align:center;padding:30px 20px}
.empty b{display:block;font-size:17px;font-weight:600;margin-bottom:4px}
.empty p{margin:0 auto;color:var(--muted);font-size:14px;max-width:34ch}

details.donebox{margin-top:8px}
details.donebox summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:8px 4px;font-weight:600;font-size:15px;color:var(--muted)}
details.donebox summary::-webkit-details-marker{display:none}
details.donebox summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
details.donebox[open] summary::before{transform:rotate(45deg)}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13.5px;padding:10px 4px;cursor:pointer}

.foot{margin-top:28px;font-size:12.5px;color:var(--muted);text-align:center}
.foot.warn{color:var(--danger)}
.devbtn{border:0;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);border-radius:999px;padding:9px 14px 9px 12px;display:inline-flex;align-items:center;gap:7px;font-weight:500;font-size:14px;cursor:pointer}
.devbtn svg{width:18px;height:18px}
.setup{margin-bottom:20px}
.setup h2{margin:0 0 6px;font-size:18px;font-weight:600}
.setup ol{margin:10px 0 0;padding-left:20px;display:grid;gap:10px;font-size:14.5px}
.setup li::marker{font-weight:600;color:var(--accent)}
.setup .err{color:var(--danger);font-size:14px;margin:8px 0 0;font-weight:500}
.linkbtn.big,.setup a.btn{display:inline-block;text-decoration:none}
.keyrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.keyrow input{flex:1 1 220px}
.qr{background:#fff;border-radius:14px;padding:10px;width:min(260px,100%);margin:6px 0 10px}
.qr svg{display:block;width:100%;height:auto}
.small{font-size:13px;color:var(--muted)}
.linkline{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere;background:var(--sunk);border-radius:10px;padding:8px 10px;margin:0 0 8px}

/* Knopf */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:20;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font:600 16px var(--font);padding:14px 22px 14px 18px;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 8px 24px rgba(19,27,39,.28)}
.fab svg{width:20px;height:20px}

/* Eintragen-Fenster */
.scrim{position:fixed;inset:0;background:rgba(8,12,18,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:92%;overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;padding:16px 16px 22px;transform:translateY(105%);visibility:hidden;transition:transform .24s ease,visibility 0s .24s}
.sheet.open{transform:none;visibility:visible;transition:transform .24s ease}
.sheet:focus{outline:none}
@media (min-width:700px){
  .sheet{left:50%;right:auto;top:50%;bottom:auto;width:min(620px,calc(100% - 32px));max-height:88%;border-radius:22px;transform:translate(-50%,-47%);opacity:0;transition:opacity .18s,transform .18s,visibility 0s .18s}
  .sheet.open{transform:translate(-50%,-50%);opacity:1;transition:opacity .18s,transform .18s}
}
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.shead h2{margin:0;font-size:19px;font-weight:600}
.xbtn{border:0;background:var(--sunk);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.xbtn svg{width:16px;height:16px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--sunk);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font-weight:500;font-size:14px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.flabel{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.sublabel{font-size:12.5px;color:var(--muted);margin:10px 0 6px}
.sublabel:first-of-type{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--sunk);color:var(--ink);font-weight:500;font-size:14.5px;padding:8px 14px;min-height:40px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.chip.subj[aria-pressed="true"]{background:var(--c);color:#fff}
.chip.subj[aria-pressed="true"] .dot{background:#fff}
.chip.date{flex-direction:column;align-items:flex-start;gap:0;border-radius:12px;padding:6px 13px;line-height:1.25}
.chip.date small{font-size:11.5px;opacity:.75;font-weight:400}
.pages{display:grid;gap:8px;margin-top:10px}
.pagerow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;background:var(--sunk);border-radius:12px;padding:7px 10px}
.pagerow b{font-weight:500;font-size:14px;min-width:112px}
.pagerow label{font-size:13.5px;color:var(--muted)}
input.mini,input.txt,input.dt{font-family:var(--font);font-size:16px;color:var(--ink);border:0;border-radius:9px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:8px 10px}
input.mini{width:74px}
input.txt{width:100%;background:var(--sunk);box-shadow:none;padding:11px 13px;border-radius:12px}
input.dt{margin-top:10px;background:var(--sunk);box-shadow:none}
.hint{margin:0;color:var(--muted);font-size:14px}
.actions{display:flex;align-items:center;gap:8px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:600;font-size:15px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--on-accent);flex:1 1 140px}
.btn.ghost{background:var(--sunk)}
.btn.danger{background:transparent;color:var(--danger);padding-left:6px;padding-right:6px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,16px);z-index:40;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{border:0;background:transparent;color:var(--bg);font-weight:600;padding:6px 8px;border-radius:8px;cursor:pointer;text-decoration:underline;flex:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none !important;animation:none !important}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Hausaufgaben</h1>
      <div class="sub" id="today">&nbsp;</div>
    </div>
    <button class="devbtn" type="button" id="devbtn" aria-label="Geräte und Synchronisierung">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="12" height="16" rx="2"/><rect x="15.5" y="9" width="6" height="11" rx="1.5"/><path d="M8 17h2"/></svg>
      Geräte
    </button>
  </header>

  <section class="stats" id="stats" aria-label="Überblick"></section>
  <section class="weeks" id="weeks" aria-label="Wochenübersicht"></section>

  <div class="layout">
    <main class="main" id="list" aria-live="polite"></main>
    <aside class="side">
      <section class="card" id="nextday" aria-label="Nächster Schultag"></section>
      <section class="card" id="tests" aria-label="Tests und Klausuren"></section>
    </aside>
  </div>

  <div class="foot" id="foot"></div>
</div>

<button class="fab" id="fab" type="button" aria-label="Neuen Eintrag anlegen">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  Eintragen
</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true" tabindex="-1">
  <div class="shead">
    <h2 id="sheet-title">Neuer Eintrag</h2>
    <button class="xbtn" type="button" id="sheet-close" aria-label="Schließen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div id="sheet-body"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" integrity="sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k" crossorigin="anonymous"></script>
<script>
"use strict";

/* ---------- Stundenplan & Kalender ---------- */
const FAECHER = {
  D:{n:"Deutsch",c:"#C2453F"}, M:{n:"Mathe",c:"#3366AA"}, VM:{n:"Vertiefung Mathe",c:"#6A8BC4"},
  S:{n:"Spanisch",c:"#C8702F"}, E:{n:"Englisch",c:"#AD8A1C"}, KU:{n:"Kunst",c:"#B04F86"},
  SP:{n:"Sport",c:"#3E9160"}, IR:{n:"Islam. Religion",c:"#23857C"}, SW:{n:"Sozialwiss.",c:"#7656A8"},
  BI:{n:"Biologie",c:"#6B9440"}, PH:{n:"Physik",c:"#5257B5"}, IF:{n:"Informatik",c:"#2C88A8"}
};
const ORDER = ["D","M","VM","S","E","KU","SP","IR","SW","BI","PH","IF"];
// Wochentag (1 = Montag) -> [Fach, erste Stunde, letzte Stunde]
const PLAN = {
  1:[["D",1,2],["M",3,4],["S",5,6],["VM",8,9]],
  2:[["KU",1,2],["SP",5,6],["D",7,7]],
  3:[["IR",1,2],["S",3,4],["M",5,5],["SW",7,8]],
  4:[["BI",1,2],["PH",3,4],["IF",5,5],["E",7,7],["IR",8,8],["KU",9,9]],
  5:[["E",1,2],["IF",3,4],["BI",5,5],["PH",6,6],["SW",7,7]]
};
// Klingelzeiten (3./4. nur als Block bekannt)

// Fach, das man laut Uhrzeit gerade hat (oder das gerade zu Ende ging)
function currentSubject(){
  const ls = lessonsOn(parse(TODAY)); if(!ls.length) return null;
  const nm = nowMin(); let cand = null;
  for(const l of ls){
    const a = lStart(l), b = lEnd(l); if(!a || !b) continue;
    if(nm >= toMin(a) && nm < toMin(b)) return { f:l[0], why:"läuft gerade" };
    if(nm >= toMin(b)) cand = l;
  }
  if(cand){
    const isLast = cand === ls[ls.length-1];
    if(!isLast || nm - toMin(lEnd(cand)) <= 30) return { f:cand[0], why:"gerade vorbei" };
  }
  return null;
}

  if(n===0) return "heute"; if(n===1) return "morgen"; if(n===2) return "übermorgen"; if(n===-1) return "gestern";

}
function isoWeek(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));

  const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil(((t - y0)/86400000 + 1)/7);
}

  if(isSchoolDay(d) && end != null && now.getHours()*60 + now.getMinutes() < end) return d;

}

const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null || v===false) continue;
    if(k==="class") el.className = v;
    else if(k==="c") el.style.setProperty("--c", v);
    else if(k==="value") el.value = v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v===true ? "" : v);
  }
  for(const k of kids.flat()){ if(k==null || k===false) continue; el.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return el;
}

const KEY_LS = "ha-schluessel", CACHE_LS = "ha-cache-v2";
const S = { items:new Map(), mode:"loading", slow:false, filterDay:null, sync:"", lastSync:0, setupErr:"" };

const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }

function rebuild(){ S.items = new Map([...ALL.values()].filter(x => !x.geloescht).map(x => [x.id, x])); }

  rebuild();
}
const b64enc = str => { const by = new TextEncoder().encode(str); let bin = ""; for(let i=0;i<by.length;i+=0x8000) bin += String.fromCharCode.apply(null, by.subarray(i, i+0x8000)); return btoa(bin); };
const b64dec = b64 => { const bin = atob((b64||"").replace(/\s/g,"")); const by = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) by[i] = bin.charCodeAt(i); return new TextDecoder().decode(by); };

async function gh(method, url, body, token){
  const r = await fetch(url, { method, cache:"no-store",
    headers: Object.assign({ Authorization:"Bearer " + (token || TOKEN), Accept:"application/vnd.github+json" }, body ? {"Content-Type":"application/json"} : {}),
    body: body ? JSON.stringify(body) : undefined });
  let data = null; try{ data = await r.json(); }catch(e){}
  return { status:r.status, data };
}
const repoUrl = () => `https://api.github.com/repos/${GH.owner}/${GH.repo}`;
const fileUrl = () => `${repoUrl()}/contents/${GH.path}`;
const isRate = d => !!(d && /rate limit/i.test(d.message || ""));

// Neuer gewinnt: erst die Änderungszahl (unabhängig von der Uhr des Geräts), bei Gleichstand die Zeit
function newer(a, b){ const ra = a.rev||0, rb = b.rev||0; return ra!==rb ? ra > rb : (a.geaendert||"") > (b.geaendert||""); }
function mergeRemote(list){
  const remote = new Map(list.map(i => [i.id, i])); let needPush = false;
  for(const r of list){ const l = ALL.get(r.id); if(!l || newer(r, l)) ALL.set(r.id, r); }
  for(const l of ALL.values()){ const r = remote.get(l.id); if(!r || newer(l, r)) needPush = true; }
  return needPush;
}
function pruneTombstones(){ const lim = Date.now() - 60*86400000; for(const [id,x] of ALL) if(x.geloescht && Date.parse(x.geaendert||0) < lim) ALL.delete(id); }

let pulling = null;
function pull(){
  if(!TOKEN || S.mode==="badkey" || S.mode==="norepo") return Promise.resolve();
  if(pulling) return pulling;
  pulling = (async () => {
    S.sync = S.sync || "laden"; renderFoot();
    try{
      const { status, data } = await gh("GET", `${fileUrl()}?ref=${GH.branch}`);
      if(status===200){
        let obj = {}; try{ obj = JSON.parse(b64dec(data.content) || "{}"); }catch(e){}
        SHA = data.sha;
        if(mergeRemote(Array.isArray(obj.eintraege) ? obj.eintraege : [])) DIRTY = true;
        S.mode = "ok"; S.sync = "ok"; S.lastSync = Date.now();
      } else if(status===404){
        const rr = await gh("GET", repoUrl());
        if(rr.status===200){ SHA = null; if(ALL.size) DIRTY = true; S.mode = "ok"; S.sync = "ok"; S.lastSync = Date.now(); }
        else { S.mode = "norepo"; S.sync = ""; }
      } else if(status===401 || (status===403 && !isRate(data))){ S.mode = "badkey"; S.sync = ""; }
      else { S.sync = "offline"; if(S.mode==="loading") S.mode = "ok"; }
    }catch(e){ S.sync = "offline"; if(S.mode==="loading") S.mode = "ok"; }
    rebuild(); saveCache(); render();
    if(DIRTY && S.mode==="ok" && S.sync==="ok") schedulePush(150);
  })();
  return pulling.finally(() => { pulling = null; });
}

let pushTimer = null, pushing = false, conflicts = 0;
function schedulePush(ms){ clearTimeout(pushTimer); pushTimer = setTimeout(push, ms==null ? 1200 : ms); }
async function push(){
  if(!TOKEN || S.mode!=="ok" || !DIRTY) return;
  if(pushing){ schedulePush(800); return; }
  pushing = true; S.sync = "speichern"; renderFoot();
  pruneTombstones();
  const ver = CHANGES;
  const body = { message:"Hausaufgaben aktualisiert", branch:GH.branch,
    content: b64enc(JSON.stringify({ version:1, geaendert:nowIso(), eintraege:[...ALL.values()] }, null, 1)) };
  if(SHA) body.sha = SHA;
  let again = false;
  try{
    const { status, data } = await gh("PUT", fileUrl(), body);
    if(status===200 || status===201){ SHA = data.content.sha; conflicts = 0; if(CHANGES===ver) DIRTY = false; S.sync = "ok"; S.lastSync = Date.now(); again = DIRTY; }
    else if(status===409 || status===422){ conflicts++; S.sync = "laden"; pushing = false; if(conflicts <= 4){ await pull(); return; } S.sync = "fehler"; }
    else if(status===401 || (status===403 && !isRate(data))){ S.mode = "badkey"; S.sync = ""; }
    else if(status===404){ S.mode = "norepo"; S.sync = ""; }
    else S.sync = "fehler";
  }catch(e){ S.sync = "offline"; }
  pushing = false; saveCache(); render();
  if(again) schedulePush(300);
}
function touch(){ CHANGES++; DIRTY = true; rebuild(); saveCache(); render(); if(S.mode==="ok") schedulePush(); }
const nextRev = id => ((ALL.get(id) && ALL.get(id).rev) || 0) + 1;
function putItem(it){ ALL.set(it.id, Object.assign({}, it, { geaendert:nowIso(), rev:nextRev(it.id) })); touch(); }
function deleteItem(id){ ALL.set(id, { id, geloescht:true, geaendert:nowIso(), rev:nextRev(id) }); touch(); }

async function connect(key){
  key = (key || "").trim();
  if(!key){ S.setupErr = "Bitte zuerst den Schlüssel einfügen."; render(); return; }
  S.setupErr = ""; S.sync = "laden"; renderFoot();
  try{
    const { status, data } = await gh("GET", repoUrl(), null, key);
    if(status===200){
      TOKEN = key; lsSet(KEY_LS, key); S.mode = "ok"; S.sync = ""; render();
      await pull();
      if(S.mode==="ok") openDevices();
      return;
    }
    S.setupErr = status===401 ? "Der Schlüssel stimmt nicht. Kopier ihn noch mal komplett."
      : status===404 ? "Der Schlüssel darf nicht auf „hausaufgaben-daten“ zugreifen. Beim Erstellen unter „Repository access“ genau dieses Repo auswählen."
      : isRate(data) ? "GitHub bremst gerade. Versuch es in ein paar Minuten noch mal."
      : "Das hat nicht geklappt. Versuch es noch mal.";
  }catch(e){ S.setupErr = "Keine Verbindung zu GitHub. Prüf das Internet."; }
  S.sync = ""; render();
}
function readKeyFromHash(){
  const m = location.hash.match(/^#k=(.+)$/);
  if(!m) return null;
  const k = decodeURIComponent(m[1]).trim();
  if(k) lsSet(KEY_LS, k);
  return k || null;
}

  TOKEN = readKeyFromHash() || lsGet(KEY_LS);

}

    out.push(h("div",{class:"card empty"}, h("b",null,"Lädt deine Einträge …"), h("p",null,"Einen Moment.")));
    box.replaceChildren(...out); return;
  }
  const all = [...S.items.values()];

  if(groups.has("none")) keys.push("none");
  for(const k of keys){
    const items = groups.get(k).sort(k==="overdue" ? (a,b)=> a.faellig<b.faellig?-1:a.faellig>b.faellig?1:cmpItems(a,b) : cmpItems);
    let titleTxt, side, danger = false;
    if(k==="overdue"){ titleTxt = "Überfällig"; side = `${items.length} offen`; danger = true; }
    else if(k==="none"){ titleTxt = "Ohne Datum"; side = ""; }
    else {
      const n = diffDays(TODAY, k);
      titleTxt = n===0 ? "Heute" : n===1 ? "Morgen" : longDate(k);
      side = n<=1 ? longDate(k) : relLabel(k);
      const frei = freiName(k); if(frei) side += ` · ${frei}`;
    }
    out.push(h("section",{class:"group"},
      h("div",{class:"ghead"+(danger?" danger":"")}, h("h2",null,titleTxt), h("span",null,side)),
      h("div",{class:"items"}, items.map(it => itemRow(it,{overdue:k==="overdue"})))
    ));
  }
  if(!keys.length){
    let msg, sub;
    if(S.filterDay){ msg = "Für diesen Tag ist nichts offen."; sub = "Tipp auf den Tag noch mal, um wieder alles zu sehen."; }
    else if(all.length){ msg = "Alles erledigt."; sub = "Neue Aufgaben trägst du unten über „Eintragen“ ein."; }
    else { msg = "Noch nichts eingetragen."; sub = "Tipp unten auf „Eintragen“: Fach wählen, Buch oder Heft antippen, Seite rein, fertig. Das Datum setze ich auf die nächste Stunde."; }
    out.push(h("div",{class:"card empty"}, h("b",null,msg), h("p",null,sub)));
  }
  // Erledigt
  const done = all.filter(i => i.erledigt).sort((a,b)=> (b.erledigtAm||"").localeCompare(a.erledigtAm||""));
  if(done.length && !S.filterDay){
    const lim = Date.now() - 7*86400000;
    const old = done.filter(i => i.erledigtAm && Date.parse(i.erledigtAm) < lim);
    const det = h("details",{class:"donebox"}, h("summary",null,`Erledigt (${done.length})`),
      h("div",{class:"items"}, done.slice(0,40).map(it => itemRow(it,{done:true}))),
      old.length ? h("button",{type:"button",class:"linkbtn",onclick:cleanDone},`${old.length} ältere erledigte löschen (über 7 Tage)`) : null);
    if(S.doneOpen) det.open = true;
    det.addEventListener("toggle", () => { S.doneOpen = det.open; });
    out.push(det);
  }
  box.replaceChildren(...out);
}

function renderNextDay(){

  const head = n===0 ? "Heute" : n===1 ? "Morgen" : WT[fd.getDay()];

  for(let d = addDays(parse(TODAY),1); ymd(d) < s; d = addDays(d,1)){ const fr = freiName(ymd(d)); if(fr && fr.endsWith("ferien")) gapFrei = fr; }

function syncText(){
  if(S.mode==="setup") return ["Noch nicht verbunden. Einträge bleiben erst mal nur auf diesem Gerät.", true];
  if(S.mode==="badkey") return ["Der Schlüssel ist ungültig oder abgelaufen. Oben neu einrichten.", true];
  if(S.mode==="norepo") return ["Der Schlüssel hat keinen Zugriff auf das Daten-Repo. Oben neu einrichten.", true];
  if(S.sync==="speichern") return ["Wird gespeichert …", false];
  if(S.sync==="laden") return ["Wird abgeglichen …", false];
  if(S.sync==="offline") return [DIRTY ? "Offline. Deine Änderungen werden übertragen, sobald du wieder Internet hast." : "Offline. Du siehst den letzten Stand.", true];
  if(S.sync==="fehler") return ["Speichern hat nicht geklappt. Ich versuche es gleich noch mal.", true];
  if(S.lastSync){ const m = Math.floor((Date.now()-S.lastSync)/60000); return [m<1 ? "Synchronisiert, gerade eben." : `Synchronisiert vor ${m} Min.`, false]; }
  return ["", false];
}

  F.typ = k;
  if(k==="todo"){ F.fach = null; F.teile.clear(); if(F.auto) F.faellig = plusDays(1); }
  else if(F.auto){ F.faellig = F.fach ? (nextLessons(F.fach,1)[0] || null) : null; }

function setFach(f){
  F.fach = f;
  const m = mats(); for(const k of [...F.teile.keys()]) if(!m.includes(k)) F.teile.delete(k);
  if(F.auto || !F.faellig){ F.faellig = nextLessons(f,1)[0] || null; F.auto = true; }
  renderSheet("f-"+f);

function saveForm(more){
  if(!canSave()) return;
  const old = F.orig, wasEdit = !!F.id;
  const teile = F.typ==="ha" ? mats().filter(m => F.teile.has(m)).map(m => ({art:m, s:F.teile.get(m).s||"", nr:F.teile.get(m).nr||""})) : [];
  const it = { id: F.id || newId(), typ:F.typ, fach: F.typ==="todo" ? null : F.fach, teile, notiz:F.notiz.trim(),
    faellig:F.faellig || null, wichtig:!!F.wichtig, erledigt: old ? !!old.erledigt : false,
    erledigtAm: old ? (old.erledigtAm||null) : null, erstellt: old ? (old.erstellt || new Date().toISOString()) : new Date().toISOString() };
  putItem(it);
  if(more){ F = blankForm(F.typ==="todo" ? "todo" : "ha"); renderSheet(); $("#sheet").scrollTop = 0; toast("Gespeichert. Nächster Eintrag."); }
  else { closeSheet(); toast(wasEdit ? "Geändert" : "Eingetragen"); }
}
function delCurrent(){
  const orig = F.orig; deleteItem(F.id); closeSheet();
  toast("Gelöscht", "Rückgängig", () => putItem(orig));
}

/* ---------- Start ---------- */
$("#fab").addEventListener("click", () => openSheet(null));
$("#sheet-close").addEventListener("click", closeSheet);
$("#scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if(e.key==="Escape" && $("#sheet").classList.contains("open")) closeSheet(); });
$("#devbtn").addEventListener("click", openDevices);
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible"){ const t = ymd(new Date()); if(t!==TODAY){ TODAY = t; render(); } pull(); } });
window.addEventListener("online", () => pull());
window.addEventListener("hashchange", () => { const k = readKeyFromHash(); if(k && k!==TOKEN){ TOKEN = k; S.mode = "ok"; pull(); } });
setInterval(() => { if(document.visibilityState==="visible") pull(); else if(DIRTY) push(); }, 45000);
render();
initStore();
setInterval(() => { const t = ymd(new Date()); if(t!==TODAY){ TODAY = t; render(); } else if(S.mode!=="loading") renderNextDay(); }, 60000);
</script>
